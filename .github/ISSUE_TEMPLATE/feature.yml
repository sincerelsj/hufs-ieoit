name: ✨ 기능 요청
description: 새 기능이나 개선 사항
title: "[Feat] "
labels: ["feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [FE, BE, AI, infra, 기타]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 무엇을, 왜
      description: 사용자 입장에서 어떤 문제를 해결하나요?
      placeholder: "학생회 신임 회장이 작년 축제 준비 과정을 한 페이지에서 볼 수 있어야 한다."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 이것들이 되면 이슈를 닫습니다.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 (디자인, API, 관련 이슈)
