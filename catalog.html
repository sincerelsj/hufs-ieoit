<style>

:root {

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); }
button { font: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
